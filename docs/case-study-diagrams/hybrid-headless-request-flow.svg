<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <title>Hybrid headless e-commerce platform — request flow</title>
  <desc>Architecture diagram of a hybrid headless e-commerce platform for an industrial manufacturer: the browser receives a server-rendered SEO document head from the CMS backend, a React single-page application owns the body, and all data flows through a same-origin zero-credential GraphQL proxy to the CMS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6470"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#fbfaf8"/>
  <text x="60" y="58" font-size="26" font-weight="700" fill="#1d232b">Hybrid headless e-commerce platform — request flow</text>
  <text x="60" y="86" font-size="15" fill="#5c6470">Bilingual platform for an industrial manufacturer · organic traffic ~6x after technical SEO rebuild</text>

  <g font-size="15" fill="#1d232b" text-anchor="middle">
    <!-- Browser -->
    <rect x="60" y="150" width="250" height="330" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <text x="185" y="185" font-size="17" font-weight="700">Browser</text>
    <rect x="85" y="210" width="200" height="100" rx="8" fill="#eaf6f4" stroke="#2a9d8f" stroke-width="1.5"/>
    <text x="185" y="248" font-weight="600" fill="#19776c">SEO head (SSR)</text>
    <text x="185" y="270" font-size="12" fill="#19776c">canonical · hreflang · OG</text>
    <text x="185" y="288" font-size="12" fill="#19776c">4 JSON-LD schema types</text>
    <rect x="85" y="330" width="200" height="120" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <text x="185" y="368" font-weight="600">SPA body</text>
    <text x="185" y="390" font-size="12" fill="#5c6470">React 18 + TypeScript</text>
    <text x="185" y="408" font-size="12" fill="#5c6470">staged URL resolver,</text>
    <text x="185" y="426" font-size="12" fill="#5c6470">request cancellation</text>

    <!-- GraphQL proxy -->
    <rect x="470" y="220" width="280" height="200" rx="12" fill="#fdf6e6" stroke="#d9a919" stroke-width="2"/>
    <text x="610" y="258" font-size="17" font-weight="700" fill="#8a6d10">Same-origin GraphQL proxy</text>
    <text x="610" y="288" font-size="12.5" fill="#8a6d10">zero-credential boundary</text>
    <text x="610" y="308" font-size="12.5" fill="#8a6d10">schema tokens stay server-side</text>
    <text x="610" y="328" font-size="12.5" fill="#8a6d10">CSRF on mutations only</text>
    <text x="610" y="348" font-size="12.5" fill="#8a6d10">responses stamped noindex</text>
    <text x="610" y="380" font-size="12.5" font-weight="600" fill="#8a6d10">no credentials reach the browser</text>

    <!-- CMS -->
    <rect x="900" y="150" width="240" height="330" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <text x="1020" y="185" font-size="17" font-weight="700">Craft CMS 5</text>
    <text x="1020" y="207" font-size="12.5" fill="#5c6470">PHP 8.2</text>
    <rect x="925" y="230" width="190" height="70" rx="8" fill="#f2f0ec" stroke="#c9d2dc"/>
    <text x="1020" y="258" font-size="13" font-weight="600">SEO head renderer</text>
    <text x="1020" y="278" font-size="11.5" fill="#5c6470">per-language XML sitemaps</text>
    <rect x="925" y="315" width="190" height="60" rx="8" fill="#f2f0ec" stroke="#c9d2dc"/>
    <text x="1020" y="340" font-size="13" font-weight="600">GraphQL API</text>
    <text x="1020" y="358" font-size="11.5" fill="#5c6470">2 custom modules (~7,100 LOC)</text>
    <rect x="925" y="390" width="190" height="60" rx="8" fill="#f2f0ec" stroke="#c9d2dc"/>
    <text x="1020" y="415" font-size="13" font-weight="600">Catalog import</text>
    <text x="1020" y="433" font-size="11.5" fill="#5c6470">queue-based</text>
  </g>

  <!-- arrows -->
  <g font-size="12.5" fill="#5c6470">
    <path d="M 310 260 C 380 260 380 260 470 280" fill="none" stroke="#5c6470" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="248" text-anchor="middle">GraphQL queries</text>
    <path d="M 750 320 L 900 320" fill="none" stroke="#5c6470" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="825" y="308" text-anchor="middle">server-side token</text>
    <path d="M 900 265 C 700 170 400 190 310 235" fill="none" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="605" y="160" text-anchor="middle" fill="#19776c">initial HTML: server-rendered SEO head + SPA shell</text>
  </g>

  <!-- footer facts -->
  <text x="60" y="560" font-size="13.5" fill="#5c6470">Hardening: GDPR consent gates all storage writes · DOMPurify on all CMS content · hCaptcha on public forms</text>
  <text x="60" y="584" font-size="13.5" fill="#5c6470">Quality: ~29k lines strict TypeScript · 91 Jest test files · 23 Cypress E2E specs behind a pre-push gate</text>
</svg>
